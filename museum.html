<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Музей Наполеона | Галерея</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: #0d0d0d; 
            color: #e0e0e0; 
            font-family: 'Georgia', serif; 
            margin: 0; 
            text-align: center; 
            padding-bottom: 80px;
            line-height: 1.6;
        }
        
        header { 
            background: #000; 
            padding: 40px 20px; 
            border-bottom: 5px solid #cfa63b; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }
        .logo { 
            color: #cfa63b; 
            font-size: 42px; 
            letter-spacing: 5px; 
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .tabs { 
            margin: 50px 0; 
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 0 20px;
        }
        .btn { 
            background: #1a1a1a; 
            color: #aaa; 
            border: 3px solid #333; 
            padding: 20px 40px; 
            cursor: pointer; 
            font-size: 22px; 
            transition: 0.4s; 
            border-radius: 8px; 
            font-family: 'Georgia', serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:hover { 
            border-color: #cfa63b; 
            color: #cfa63b; 
            background: #222;
        }
        .btn.active { 
            background: linear-gradient(135deg, #cfa63b, #f3d57c); 
            border-color: #f3d57c;
            color: #000; 
            font-weight: bold; 
            box-shadow: 0 0 30px rgba(207, 166, 59, 0.5);
        }
        
        .gallery { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); 
            gap: 40px; 
            max-width: 1300px; 
            margin: 0 auto; 
            padding: 0 40px; 
        }
        .card { 
            background: linear-gradient(145deg, #1a1a1a, #0a0a0a); 
            border: 2px solid #333; 
            border-radius: 15px; 
            padding: 30px; 
            cursor: pointer; 
            transition: 0.4s; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card:hover { 
            border-color: #cfa63b; 
            transform: translateY(-10px); 
            box-shadow: 0 25px 50px rgba(207, 166, 59, 0.2);
        }
        
        .art-frame {
            background: #000;
            border: 3px solid #cfa63b;
            border-radius: 8px;
            padding: 15px;
            width: 100%;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,1);
        }
        
        .card svg { width: 100%; height: 100%; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8)); }
        
        .card h3 { color: #cfa63b; margin: 0; font-size: 28px; letter-spacing: 1px; }
        
        /* Модальное окно */
        #modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); 
            backdrop-filter: blur(5px);
            justify-content: center; 
            align-items: center; 
            z-index: 100; 
            padding: 20px;
        }
        .modal-box { 
            background: #111; 
            border: 3px solid #cfa63b; 
            width: 100%; 
            max-width: 850px; 
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 0 80px rgba(207, 166, 59, 0.3);
            max-height: 90vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .modal-box svg { 
            width: 250px; 
            height: 250px; 
            margin-bottom: 30px;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,1));
        }
        .modal-box h2 { 
            color: #cfa63b; 
            margin: 0 0 25px 0; 
            font-size: 40px; 
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
            width: 100%;
        }
        .modal-box p { 
            color: #ddd; 
            text-align: left; 
            line-height: 1.8; 
            font-size: 22px; /* Удобный крупный текст */
            margin-bottom: 30px;
            background: #1a1a1a;
            padding: 25px;
            border-radius: 8px;
            border-left: 5px solid #cfa63b;
        }
        .close-btn { 
            background: linear-gradient(135deg, #cfa63b, #f3d57c); 
            color: #000; 
            border: none; 
            padding: 15px 40px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 8px; 
            font-size: 22px; 
            font-family: 'Georgia', serif;
            transition: 0.3s;
            text-transform: uppercase;
        }
        .close-btn:hover { background: #fff; }
        
        .room { display: none; }
        .room.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 768px) {
            .logo { font-size: 28px; }
            .btn { font-size: 16px; padding: 15px 25px; }
            .gallery { grid-template-columns: 1fr; padding: 0 15px; gap: 30px; }
            .art-frame { height: 250px; }
            .card h3 { font-size: 24px; }
            .modal-box { padding: 20px; }
            .modal-box h2 { font-size: 28px; }
            .modal-box p { font-size: 18px; padding: 15px; }
            .close-btn { font-size: 18px; padding: 12px 25px; }
        }
    </style>
</head>
<body>

    <header><div class="logo">⚜️ Музей Наполеона</div></header>

    <div class="tabs">
        <button class="btn active" onclick="showRoom(1, this)">Зал 1: Личность</button>

    <!-- Зал 3 -->
    <div id="room3" class="room">
        <div class="gallery">

    <script>
        const art = [

            `<svg viewBox="0 0 100 100"><defs><linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#999"/><stop offset="50%" stop-color="#fff"/><stop offset="100%" stop-color="#666"/></linearGradient></defs><polygon points="48,5 52,5 50,65" fill="url(#blade)"/><path d="M25 65 Q50 80 75 65" stroke="#cfa63b" stroke-width="6" fill="none" stroke-linecap="round"/><rect x="45" y="65" width="10" height="25" fill="#3a1a0a" rx="3"/><line x1="45" y1="75" x2="55" y2="75" stroke="#cfa63b" stroke-width="1.5"/><circle cx="50" cy="93" r="6" fill="#cfa63b"/><circle cx="50" cy="93" r="3" fill="#b22222"/></svg>`,
            `<svg viewBox="0 0 100 100"><defs><linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fdf5e6"/><stop offset="100%" stop-color="#d4c4a8"/></linearGradient></defs><rect x="10" y="10" width="80" height="80" fill="url(#paper)" transform="rotate(-5 50 50)" stroke="#8b6914" stroke-width="1"/><path d="M20 20 L40 40 L60 30 L80 60 L70 80 L30 70 Z" stroke="#8b4513" stroke-width="1.5" fill="none" transform="rotate(-5 50 50)"/><circle cx="60" cy="30" r="3" fill="#b22222" transform="rotate(-5 50 50)"/><circle cx="80" cy="60" r="2" fill="#b22222" transform="rotate(-5 50 50)"/><circle cx="75" cy="75" r="10" fill="none" stroke="#8b4513" stroke-width="1" transform="rotate(-5 50 50)"/></svg>`,
            `<svg viewBox="0 0 100 100"><defs><linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5b3a29"/><stop offset="100%" stop-color="#1a0f05"/></linearGradient></defs><ellipse cx="50" cy="85" rx="40" ry="10" fill="#000" opacity="0.5"/><circle cx="25" cy="75" r="15" fill="url(#wood)" stroke="#111" stroke-width="2"/><circle cx="25" cy="75" r="5" fill="#111"/><line x1="25" y1="60" x2="25" y2="90" stroke="#111" stroke-width="2"/><line x1="10" y1="75" x2="40" y2="75" stroke="#111" stroke-width="2"/><circle cx="75" cy="75" r="15" fill="url(#wood)" stroke="#111" stroke-width="2"/><circle cx="75" cy="75" r="5" fill="#111"/><line x1="75" y1="60" x2="75" y2="90" stroke="#111" stroke-width="2"/><line x1="60" y1="75" x2="90" y2="75" stroke="#111" stroke-width="2"/><rect x="20" y="60" width="60" height="10" fill="#2b1d14" rx="2"/><rect x="10" y="50" width="80" height="12" fill="#444" rx="4"/><circle cx="85" cy="56" r="8" fill="#222" stroke="#555" stroke-width="2"/></svg>`,
            `<svg viewBox="0 0 100 100"><rect x="15" y="20" width="70" height="60" fill="#fff8dc" transform="rotate(-5 50 50)" stroke="#c4a87a" stroke-width="1"/><line x1="25" y1="35" x2="75" y2="35" stroke="#333" stroke-width="2" opacity="0.4" transform="rotate(-5 50 50)"/><line x1="25" y1="45" x2="75" y2="45" stroke="#333" stroke-width="2" opacity="0.4" transform="rotate(-5 50 50)"/><line x1="25" y1="55" x2="60" y2="55" stroke="#333" stroke-width="2" opacity="0.4" transform="rotate(-5 50 50)"/><line x1="25" y1="65" x2="70" y2="65" stroke="#333" stroke-width="2" opacity="0.4" transform="rotate(-5 50 50)"/><circle cx="65" cy="70" r="10" fill="#b22222" opacity="0.8" transform="rotate(-5 50 50)"/></svg>`,
            `<svg viewBox="0 0 100 100"><defs><linearGradient id="leather" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#5b3a29"/><stop offset="100%" stop-color="#1a0a00"/></linearGradient></defs><rect x="20" y="15" width="60" height="75" fill="url(#leather)" rx="5" stroke="#0a0500" stroke-width="2"/><rect x="20" y="15" width="10" height="75" fill="#1a0a00" rx="2"/><rect x="35" y="25" width="35" height="55" fill="none" stroke="#cfa63b" stroke-width="1.5" rx="2"/><text x="52" y="45" font-family="Georgia" font-size="8" fill="#cfa63b" text-anchor="middle">CODE</text><text x="52" y="55" font-family="Georgia" font-size="6" fill="#cfa63b" text-anchor="middle">NAPOLÉON</text><path d="M55 80 L55 65 L60 70 L65 65 L65 80" fill="#800000"/></svg>`,
            `<svg viewBox="0 0 100 100"><defs><radialGradient id="goldC" cx="30%" cy="30%" r="70%"><stop offset="0%" stop-color="#fff8b0"/><stop offset="50%" stop-color="#cfa63b"/><stop offset="100%" stop-color="#8b6914"/></radialGradient></defs><ellipse cx="50" cy="85" rx="35" ry="8" fill="#000" opacity="0.6"/><ellipse cx="50" cy="50" rx="35" ry="35" fill="#8b6914"/><ellipse cx="50" cy="48" rx="35" ry="35" fill="url(#goldC)"/><ellipse cx="50" cy="48" rx="30" ry="30" fill="none" stroke="#b8860b" stroke-width="1"/><path d="M35 45 Q40 30 50 30 Q60 30 65 45" fill="none" stroke="#8b6914" stroke-width="1.5"/><path d="M35 50 Q40 65 50 65 Q60 65 65 50" fill="none" stroke="#8b6914" stroke-width="1.5"/></svg>`
        ];

        const titles = ["Портрет Императора", "Двууголка", "Церемониальная шпага", "Карта Аустерлица", "Полевая пушка", "Письмо Жозефине", "Кодекс Наполеона", "Золотой Наполеондор"];
        
        // ПОДРОБНЫЕ И ИНТЕРЕСНЫЕ ОПИСАНИЯ
        const descs = [
            "Этот парадный портрет изображает Наполеона Бонапарта в расцвете его славы. Художник запечатлел императора в парадном мундире с золотыми эполетами, символизирующими его высокий военный чин. На голове — знаменитая черная двууголка, которая стала неотъемлемой частью его образа. Взгляд Наполеона устремлен вперед, что подчеркивает его решительность и непреклонную волю. Этот портрет долгие годы висел в Тюильрийском дворце и служил символом могущества Французской империи. Обратите внимание на то, как художник передал фактуру ткани и блеск золотого шитья.",
            
            "Двууголка (бикорн) — это самый узнаваемый головной убор Наполеона и настоящий символ его эпохи. Обычно такие шляпы носили спереди, но Наполеон надевал её боком (en bataille), чтобы его силуэт был легко узнаваем в гуще сражения. Шляпа изготовлена из черного войлока и украшена скромной трехцветной кокардой с золотой окантовкой. Интересный факт: за свою жизнь император износил более 120 таких шляп! Эта конкретная двууголка была с ним во время битвы при Ватерлоо. Сегодня она хранится в музее как одна из главных реликвий, ведь именно по этой шляпе солдаты узнавали своего командира на поле боя.",
            
            "Эта церемониальная шпага была преподнесена Наполеону офицерами после триумфальной битвы при Маренго в 1800 году. Клинок изготовлен из дамасской стали, а рукоять украшена золотом и бриллиантами. Несмотря на роскошь, император предпочитал более простое оружие в бою, а эту шпагу носил исключительно на официальных приемах и коронациях. На гарде выгравирован девиз: «Честь и Родина». Шпага является символом дворянства и воинской доблести, которые Наполеон ценил превыше всего. Это не просто оружие, а знак признания его полководческого таланта.",
            
            "Карта битвы при Аустерлице, составленная лично Наполеоном. Это сражение 1805 года вошло в историю как «Битва трех императоров» (французского, русского и австрийского). Гениальный план Наполеона заключался в том, чтобы намеренно ослабить свой правый фланг, заманив противника в ловушку. Карта испещрена пометками и стрелками, указывающими направление ударов. Битва закончилась блестящей победой французов и привела к распаду антифранцузской коалиции. Этот документ — свидетельство стратегического гения великого полководца, который умел просчитывать ходы на несколько шагов вперед.",
            
            "Полевая пушка (6-фунтовка) — основное орудие французской артиллерии. Наполеон начинал свою карьеру как артиллерийский офицер и прекрасно понимал силу пушек. Он разработал тактику «Большой батареи» (Grand Battery), суть которой заключалась в концентрации большого количества орудий на одном участке фронта для прорыва обороны противника. Эта пушка принимала участие в Бородинском сражении. Ствол изготовлен из чугуна, а лафет — из дуба. Такие орудия были грозной силой, способной решать исход целых битв. Именно артиллерия часто становилась решающим фактором побед Наполеона.",
            
            "Любовное письмо, написанное рукой Наполеона своей первой жене Жозефине Богарне во время Итальянской кампании. Император, известный своей суровостью на поле боя, в письмах был невероятно страстным и романтичным. «Я не провел и дня, не любя тебя...» — писал он. Письмо написано на состаренной бумаге чернилами. В правом нижнем углу — личная сургучная печать с инициалом «N». Эти письма считаются одними из самых трогательных свидетельств истории любви. Жозефина хранила их до конца своих дней, и они сохранились до наших времен.",
            
            "Гражданский кодекс Франции (Кодекс Наполеона) был принят в 1804 году. Этот документ стал фундаментом современного французского права и оказал огромное влияние на законодательство всего мира. Кодекс закрепил равенство всех перед законом, право на частную собственность и светский характер государства. Наполеон лично участвовал в заседаниях комиссии по его разработке. Переплет выполнен из телячьей кожи с золотым тиснением. Кодекс состоит из 2281 статьи. Сам Наполеон говорил: «Моя истинная слава — не в сорока сражениях, а в моем Гражданском кодексе». Этот документ пережил империю и до сих пор лежит в основе права многих стран.",
            
            "Золотой наполеондор — монета номиналом 20 франков, введенная в обращение при Наполеоне. На аверсе изображен профиль императора в лавровом венке, на реверсе — герб Французской империи. Монета чеканилась из высокопробного золота (900 пробы) и весила 6,45 грамма. Наполеондор стал одной из самых стабильных и надежных валют Европы XIX века. Он использовался для крупных торговых сделок и военных контрибуций. Сегодня такие монеты являются предметом коллекционирования и стоят гораздо больше своего номинала. Эта монета — свидетель экономической мощи Франции той эпохи."
        ];

        for (let i = 0; i < 8; i++) {
            document.getElementById('svg' + (i + 1)).innerHTML = art[i];
        }

        function showRoom(num, btn) {
            document.querySelectorAll('.room').forEach(r => r.classList.remove('active'));
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            document.getElementById('room' + num).classList.add('active');
            btn.classList.add('active');
        }

        function showModal(id) {
            document.getElementById('modal-title').innerText = titles[id - 1];
            document.getElementById('modal-desc').innerText = descs[id - 1];
            document.getElementById('modal-svg-container').innerHTML = art[id - 1];
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
